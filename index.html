<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><title>Mi Calendario de Turnos</title><!-- deploy firebase auth --><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body><div id="app"><div id="cloudbar"><span id="cloudStatus">☁ Sin iniciar sesión</span><button id="loginBtn">Entrar con Google</button><button id="logoutBtn" hidden>Salir</button></div><header class="shifterHead"><div class="calendarName"><span class="pencil">✎</span><strong>Mi calendario</strong><span>▼</span></div><button class="shareBtn">↗</button></header><div class="viewTabs"><button class="activeView" id="monthTab">MES</button><button id="yearTab">AÑO</button><button id="summaryTab">RESUMEN</button></div><div class="monthNav"><button id="prev">‹</button><h1 id="month"></h1><button id="next">›</button></div><section class="summary"><div><b id="hours">0 h</b><span>HORAS</span></div><div><b id="days">0</b><span>TURNOS</span></div><div><b id="income">₡0</b><span>INGRESOS</span></div></section><main><section id="yearView" hidden></section><section id="summaryView" hidden></section><div id="monthView"><div class="week"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div><div id="calendar" class="calendar"></div></div></main><nav class="shifterNav"><button id="paintBtn">▦<span>PINTAR</span></button><button id="statsBtn">✎<span>EDITAR</span></button><button id="add" class="add">＋</button><button id="shiftsBtn">▤<span>TURNOS</span></button><button id="settingsBtn">⚙<span>AJUSTES</span></button></nav></div><dialog id="editor"><form method="dialog"><h2 id="editTitle">Agregar turno</h2><label>Tipo<select id="type"><option value="morning">Mañana</option><option value="afternoon">Tarde</option><option value="night">Noche</option><option value="free">Día libre</option><option value="vacation">Vacaciones</option><option value="holiday">Feriado</option><option value="sick">Incapacidad</option></select></label><div class="times"><label>Entrada<input id="start" type="time" value="08:00"></label><label>Salida<input id="end" type="time" value="17:00"></label></div><label>Descanso (min)<input id="break" type="number" min="0" value="60"></label><label>Pago por hora ₡<input id="rate" type="number" min="0" value="0"></label><label>Nota<textarea id="note" rows="2"></textarea></label><div class="actions"><button value="cancel">Cancelar</button><button type="button" id="delete" class="danger">Eliminar</button><button type="button" id="save" class="primary">Guardar</button></div></form></dialog><dialog id="paintDialog"><form method="dialog"><h2>Pintar turnos</h2><p class="helper">Elija un turno y después toque los días que quiera pintar.</p><div class="paintChoices"><button type="button" data-type="morning"><i class="morning">M</i><span>Mañana</span></button><button type="button" data-type="afternoon"><i class="afternoon">T</i><span>Tarde</span></button><button type="button" data-type="night"><i class="night">N</i><span>Noche</span></button><button type="button" data-type="free"><i class="free">L</i><span>Libre</span></button><button type="button" data-type="vacation"><i class="vacation">V</i><span>Vacaciones</span></button><button type="button" data-type="holiday"><i class="holiday">F</i><span>Feriado</span></button></div><button>Cancelar</button></form></dialog><dialog id="editTools"><form method="dialog"><h2>Editar calendario</h2><p class="helper">Seleccione una acción y luego toque un día.</p><div class="editGrid"><button type="button" data-action="copy">▣<span>Copiar</span></button><button type="button" data-action="paste">▤<span>Pegar</span></button><button type="button" data-action="erase">⌫<span>Borrar</span></button></div><button>Cerrar</button></form></dialog><dialog id="shiftManager"><form method="dialog"><h2>Mis turnos</h2><div id="shiftCards"></div><button class="primary">Cerrar</button></form></dialog><dialog id="info"><form method="dialog"><h2 id="infoTitle">Resumen</h2><div id="infoBody"></div><button class="primary">Cerrar</button></form></dialog><script src="firebase-config.js"></script><script type="module" src="app.js"></script></body></html>
