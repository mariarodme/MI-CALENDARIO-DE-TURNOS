<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><title>Mi Calendario de Turnos</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body><div id="app">
<div id="cloudbar"><span id="cloudStatus">☁ Sin iniciar sesión</span><button id="loginBtn">Entrar con Google</button><button id="logoutBtn" hidden>Salir</button></div>
<header><button id="prev">‹</button><div><h1 id="month"></h1><small>MI CALENDARIO DE TURNOS</small></div><button id="next">›</button></header>
<section class="summary"><div><b id="hours">0 h</b><span>Horas</span></div><div><b id="days">0</b><span>Turnos</span></div><div><b id="income">₡0</b><span>Estimado</span></div></section>
<main><div class="week"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div><div id="calendar" class="calendar"></div></main>
<nav><button class="active">▦<span>Calendario</span></button><button id="statsBtn">◔<span>Resumen</span></button><button id="add" class="add">＋</button><button id="shiftsBtn">◫<span>Turnos</span></button><button id="settingsBtn">⚙<span>Ajustes</span></button></nav></div>
<dialog id="editor"><form method="dialog"><h2 id="editTitle">Agregar turno</h2><label>Tipo<select id="type"><option value="morning">Mañana</option><option value="afternoon">Tarde</option><option value="night">Noche</option><option value="free">Día libre</option><option value="vacation">Vacaciones</option><option value="holiday">Feriado</option><option value="sick">Incapacidad</option></select></label><div class="times"><label>Entrada<input id="start" type="time" value="08:00"></label><label>Salida<input id="end" type="time" value="17:00"></label></div><label>Descanso (min)<input id="break" type="number" min="0" value="60"></label><label>Pago por hora ₡<input id="rate" type="number" min="0" value="0"></label><label>Nota<textarea id="note" rows="2"></textarea></label><div class="actions"><button value="cancel">Cancelar</button><button type="button" id="delete" class="danger">Eliminar</button><button type="button" id="save" class="primary">Guardar</button></div></form></dialog>
<dialog id="info"><form method="dialog"><h2 id="infoTitle">Resumen</h2><div id="infoBody"></div><button class="primary">Cerrar</button></form></dialog>
<script src="firebase-config.js"></script><script type="module" src="app.js"></script></body></html>
